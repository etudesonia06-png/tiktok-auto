name: Relance Telegram

# Toutes les heures : si la derniere video n'a pas pu etre envoyee (Telegram en panne,
# jeton a renouveler...), elle est renvoyee automatiquement des que Telegram fonctionne.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relance-telegram

jobs:
  relance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Une video attend-elle d'etre envoyee ?
        id: todo
        run: |
          n=$(python3 -c "import json;h=json.load(open('data/history.json'));print(sum(1 for x in h if not x.get('telegram')))" 2>/dev/null || echo 0)
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "$n video(s) en attente"

      - name: Recuperer la copie privee
        if: steps.todo.outputs.n != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T=$(gh release list --limit 20 --json tagName,createdAt --jq '[.[] | select(.tagName|startswith("video-"))] | sort_by(.createdAt) | last | .tagName')
          [ -n "$T" ] && gh release download "$T" -p '*.mp4' -D /tmp/v --clobber || true
          ls /tmp/v 2>/dev/null || echo "aucune copie trouvee"

      - name: Memoire privee (identifiant Telegram)
        if: steps.todo.outputs.n != '0'
        uses: actions/cache@v4
        with:
          path: /home/runner/.tiktok-state
          key: tiktok-state-${{ github.run_id }}
          restore-keys: tiktok-state-

      - name: Envoyer sur Telegram
        if: steps.todo.outputs.n != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHATID || secrets.CHAT_ID }}
          VIDEOS_PAGE: ${{ github.server_url }}/${{ github.repository }}/releases
          STATE_DIR: /home/runner/.tiktok-state
        run: |
          V=$(ls /tmp/v/*.mp4 2>/dev/null | head -1)
          [ -n "$V" ] || exit 0
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          pip install -q requests numpy Pillow
          python main.py --resend "$V" || true

      - name: Enregistrer
        if: steps.todo.outputs.n != '0'
        run: |
          git config user.name "tiktok-bot"; git config user.email "tiktok-bot@users.noreply.github.com"
          git add data/ && git diff --cached --quiet && exit 0
          git commit -qm "Video envoyee sur Telegram" && git pull -q --rebase && git push -q || true
