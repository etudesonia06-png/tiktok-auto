name: Video TikTok du jour

on:
  schedule:
    - cron: "7 4 * * *"   # chaque jour vers 5 h 07 (hiver) / 6 h 07 (été), heure de Paris
  push:
    paths: ["*.zip"]
  workflow_dispatch:
    inputs:
      mode:
        description: "football, series, trend ou vide (planning du jour)"
        default: ""
      engine:
        description: "blender ou images"
        default: "blender"
      script:
        description: "script JSON du depot a utiliser (ex : scripts/test_panenka.json), vide = script du jour"
        default: ""
      check_only:
        description: "oui = seulement verifier Gemini et Telegram (1 minute)"
        default: "non"

permissions:
  contents: write

concurrency:
  group: daily-video

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BLENDER_DIR: /opt/blender
      BLENDER_VERSION: "4.2.3"
      STATE_DIR: /home/runner/.tiktok-state
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer ou mettre a jour le code (zip le plus recent)
        run: |
          git config user.name "tiktok-bot"
          git config user.email "tiktok-bot@users.noreply.github.com"
          Z=""; ZT=0
          for f in *.zip; do
            [ -f "$f" ] || continue
            t=$(git log -1 --format=%ct -- "$f"); t=${t:-0}
            if [ "$t" -ge "$ZT" ]; then ZT=$t; Z="$f"; fi
          done
          if [ -n "$Z" ]; then
            echo "Installation depuis : $Z"
            unzip -oq "$Z" -d /tmp/app
            rm -rf /tmp/app/tiktok-auto/.github
            cp -r /tmp/app/tiktok-auto/. .
            git rm -q -- *.zip
            git add -A
            git commit -m "Installation de l'application" && git push
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: FFmpeg, police et dependances
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1
          pip install -q -r requirements.txt
          mkdir -p assets/fonts
          [ -s assets/fonts/Montserrat.ttf ] || curl -fsSL -o assets/fonts/Montserrat.ttf "https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf"

      - name: Memoire privee (identifiant Telegram)
        uses: actions/cache@v4
        with:
          path: /home/runner/.tiktok-state
          key: tiktok-state-${{ github.run_id }}
          restore-keys: tiktok-state-

      - name: Blender (cache)
        id: cb
        uses: actions/cache@v4
        with:
          path: /opt/blender
          key: blender-4.2.3

      - name: Installer Blender
        if: steps.cb.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/b.tar.xz "https://download.blender.org/release/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          sudo mkdir -p $BLENDER_DIR && sudo tar -xJf /tmp/b.tar.xz -C $BLENDER_DIR --strip-components=1
          sudo chown -R $USER $BLENDER_DIR

      - name: Verifier Gemini et Telegram (aucune valeur affichee)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY || secrets.GOOGLE_API_KEY || secrets.GOOGLE_AI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHATID || secrets.CHAT_ID }}
          BLENDER_BIN: /opt/blender/blender
        run: python main.py --check

      - name: Creer la video
        if: github.event.inputs.check_only != 'oui'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY || secrets.GOOGLE_API_KEY || secrets.GOOGLE_AI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHATID || secrets.CHAT_ID }}
          BLENDER_BIN: /opt/blender/blender
          RENDER_BUDGET_MIN: "110"
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_TOKEN_OUT: ${{ runner.temp }}/tiktok_rt
          # depot TikTok en prive desactive : rien ne part sur TikTok sans validation manuelle
          TIKTOK_PRIVATE_UPLOAD: "0"
          ENGINE: ${{ github.event.inputs.engine || 'blender' }}
          MODE_IN: ${{ github.event.inputs.mode }}
          SCRIPT_IN: ${{ github.event.inputs.script }}
          TZ: Europe/Paris
        run: |
          A=""; [ -n "$MODE_IN" ] && A="--mode $MODE_IN"
          S="$SCRIPT_IN"
          # depot d'une mise a jour (zip) = video de test avec le script valide
          [ "${{ github.event_name }}" = "push" ] && [ -f scripts/test_panenka.json ] && S="scripts/test_panenka.json"
          [ -n "$S" ] && A="$A --script $S"
          python main.py $A || { echo "Nouvel essai en mode images"; ENGINE=images python main.py $A; }

      - name: Ranger le nouveau jeton TikTok dans les secrets chiffres
        if: always()
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          F: ${{ runner.temp }}/tiktok_rt
        run: |
          [ -s "$F" ] || exit 0
          echo "::add-mask::$(cat "$F")"
          [ -n "$GH_TOKEN" ] && gh secret set TIKTOK_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$F" || echo "jeton non mis a jour"
          rm -f "$F"

      - name: Video telechargeable 7 jours
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            output/**/*.mp4
            output/**/publication.json
            output/**/script.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Historique
        if: always()
        run: |
          git add data/
          git diff --cached --quiet && { echo "rien"; exit 0; }
          git commit -qm "Video du $(date +%F)"
          for i in 1 2 3; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "historique non enregistre"

      - name: Alerte Telegram si echec
        if: failure()
        env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.BOT_TOKEN }}
          C: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHATID || secrets.CHAT_ID }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$T" ] && exit 0
          [ -z "$C" ] && [ -s "$STATE_DIR/telegram_chat_id" ] && C=$(cat "$STATE_DIR/telegram_chat_id")
          [ -z "$C" ] && C=$(curl -s "https://api.telegram.org/bot$T/getUpdates" | python3 -c "import sys,json;r=json.load(sys.stdin).get('result',[]);print(next((str(u['message']['chat']['id']) for u in reversed(r) if 'message' in u),''))")
          [ -z "$C" ] && exit 0
          curl -s -o /dev/null "https://api.telegram.org/bot$T/sendMessage" --data-urlencode "chat_id=$C" --data-urlencode "text=La video du jour a echoue : $URL"
